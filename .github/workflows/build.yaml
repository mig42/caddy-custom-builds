name: Build Caddy custom images
on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Versión de Caddy'
        required: true
        default: '2.11.4'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: caddy-duckdns-ionos
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/caddy-duckdns-ionos:${{ github.event.inputs.caddy_version }}
          build-args: CADDY_VERSION=${{ github.event.inputs.caddy_version }}
